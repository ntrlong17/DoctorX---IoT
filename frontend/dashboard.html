<!DOCTYPE html>
<html lang="vi">
  <head>
    <!-- Thiết lập bảng mã tiếng Việt -->
    <meta charset="UTF-8" />
    <!-- Tiêu đề tab trình duyệt -->
    <title>DoctorX - Garden</title>

    <!-- Thư viện Chart.js (hiện tại chưa dùng, để sau nếu cần vẽ biểu đồ) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      /* Reset mặc định */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* Toàn bộ body trang */
      body {
        font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;



        color: #e5e7eb;
        min-height: 100vh;

        /* Thu nhỏ giao diện (nếu muốn to hơn nâng lên 0.9) */
        zoom: 0.8;

        /* Sẽ bị thay bằng ảnh trong JS theo buổi trong ngày */
        background-color: #020617;
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
      }

      /* Khung chứa sidebar + main bên phải */
      .app-shell {
        display: flex;
        min-height: 100vh;
      }

      /* ========================= SIDEBAR ========================= */

      .sidebar {
        width: 350px;
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        padding: 22px 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        border-right: 1px solid rgba(15, 23, 42, 0.7);
        box-shadow: 4px 0 25px rgba(0, 0, 0, 0.5);
      }

      .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 17px;
        padding: 30px 32px;
        border-radius: 16px;
        background: radial-gradient(circle at top left, #22c55e55, #0f172a 60%);
      }

.sidebar-brand-icon {
        /* khung logo vuông, không bị co */
        width: 80px;
        height: 80px;
        flex: 0 0 80px;          /* khóa chiều rộng trong flex */
        aspect-ratio: 1 / 1;

        border-radius: 100%;      /* bo tròn khung */
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;        /* cắt phần ảnh thừa */
        padding: 0;
      }

      .sidebar-brand-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;       /* căng đầy khung, không méo */
        border-radius: 100%;      /* bản thân ảnh cũng tròn */
        display: block;
      }

      .sidebar-brand-text-main {
        font-size: 25px;
        font-weight: 700;
      }

      .sidebar-brand-text-sub {
        font-size: 15px;
        color: #9ca3af;
      }

      .sidebar-nav {
        flex: 1;
        display: flex;
        flex-direction: column;
        margin-top: 4px;
        gap: 50px;
        justify-content: flex-start;
      }

      .nav-label-heading {
        font-size: 30px;
        letter-spacing: 10px;
        text-transform: uppercase;
        color: #6b7280;
        padding: 0 4px 4px;
      }

      .nav-item {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 12px 16px;
        min-height: 54px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        font-weight: 500;
        color: #cbd5f5;
        background: transparent;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
      }

      .nav-item:hover {
        background: rgba(148, 163, 184, 0.12);
        transform: translateY(-1px);
      }

      .nav-item.active {
        background: linear-gradient(90deg, #22d3ee, #22c55e);
        color: #0f172a;
        box-shadow: 0 10px 24px rgba(34, 211, 238, 0.45);
      }

      .nav-icon {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        flex-shrink: 0;
      }

      .nav-item.active .nav-icon {
        background: rgba(15, 23, 42, 0.1);
      }

      .nav-text-main {
        font-size: 25px;
      }

      .nav-text-sub {
        font-size: 20px;
        color: #9ca3af;
      }

      .nav-item.active .nav-text-sub {
        color: #0f172a;
      }

      /* ========================= MAIN ========================= */

      .main-area {
        flex: 1;
        padding: 22px 26px 32px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .main-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding: 14px 18px;
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.75);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.7);
      }

      .main-title {
        font-size: 40px;
        font-weight: 700;
      }

      .main-subtitle {
        font-size: 20px;
        color: #9ca3af;
        margin-top: 4px;
      }

      .user-box {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(15, 23, 42, 0.7);
        padding: 6px 10px;
        border-radius: 999px;
      }

      .user-name-pill {
        padding: 10px 15px;
        border-radius: 999px;
        background: rgba(55, 65, 81, 0.8);
        font-size: 15px;
      }

      .btn-logout {
        border: none;
        border-radius: 999px;
        padding: 15px 40px;
        font-size: 20px;
        font-weight: 600;
        cursor: pointer;
        background: #ef4444;
        color: #fee2e2;
        box-shadow: 0 6px 14px rgba(248, 113, 113, 0.4);
        transition: transform 0.1s ease, box-shadow 0.1s ease,
          background 0.1s ease;
      }

      .btn-logout:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 22px rgba(248, 113, 113, 0.6);
        background: #dc2626;
      }

      /* ================== CARD MÔ PHỎNG GARDEN ================== */

      .garden-sim {
        margin-top: -20px;
        width: 100%;
        flex: 1;
        display: flex;
      }

.garden-sim-card {
  position: relative;
  width: 100%;
  max-width: 100%;
  min-height: calc(100vh - 170px);
  margin: 0;
  border-radius: 24px;
  padding: 28px 32px;
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;

  /* nền cây */
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  box-shadow: 0 20px 45px rgba(15, 23, 42, 0.7);
  overflow: hidden;

  /* giúp ảnh nét hơn khi scale (không bắt buộc nhưng nên có) */
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
}

/* overlay chỉ làm tối nhẹ bên trái, không phủ kín cây */
.garden-sim-card::before {
  content: "";
  position: absolute;
  inset: 0;
  /* overlay nhẹ, chỉ nằm quanh khu panel bên trái */
  background: radial-gradient(
    circle at 140px 50%,
    rgba(15, 23, 42, 0.65) 0%,
    rgba(15, 23, 42, 0.35) 22%,
    rgba(15, 23, 42, 0.0) 50%
  );
  pointer-events: none;
}



      .garden-sim-left {
        position: relative;
        z-index: 1;
        max-width: 520px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .garden-sim-title {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
      }

      .garden-sim-sub {
        margin: 0 0 8px;
        font-size: 13px;
        color: #e5e7eb;
      }

      /* ==== 3 KHUNG TRẮNG MÔ PHỎNG ==== */

      .sim-summary-boxes {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
      }

      .sim-summary-box {
        background: rgba(255, 255, 255, 0.12); /* trắng trong suốt */
        border: 1px solid rgba(148, 163, 184, 0.8); /* viền xám */
        border-radius: 18px;
        padding: 10px 14px;
        backdrop-filter: blur(6px);
      }

      .sim-summary-title {
        font-size: 13px;
        color: #d1d5db;
        margin-bottom: 4px;
      }

      .sim-summary-value {
        font-size: 20px;
        font-weight: 600;
      }

      /* Badge cũ vẫn giữ nếu sau này bạn dùng lại */
      .stat-badge {
        display: inline-block;
        margin-top: 4px;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        background: rgba(96, 165, 250, 0.15);
        border: 1px solid rgba(96, 165, 250, 0.5);
        color: #bfdbfe;
      }

      /* Nhóm nút +100ml và Reset */
      .garden-sim-actions {
        display: flex;
        gap: 12px;
        margin-top: 12px;
      }

      /* Nút +100ml: xanh pastel trong suốt + viền xanh đậm */
      .btn-sim-primary {
        border-radius: 999px;
        padding: 8px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid #1d4ed8; /* xanh đậm */
        background: rgba(59, 130, 246, 0.18); /* xanh pastel trong suốt */
        color: #eff6ff;
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
      }

      /* Nút Reset: xám trong suốt + viền xám đậm */
      .btn-sim-ghost {
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.85);
        padding: 8px 18px;
        font-size: 13px;
        font-weight: 500;
        background: rgba(15, 23, 42, 0.3);
        color: #e5e7eb;
        cursor: pointer;
      }

      .garden-threshold-list {
        margin: 12px 0 0;
        padding-left: 20px;
        font-size: 12px;
        color: #e5e7eb;
      }

      .garden-threshold-list li + li {
        margin-top: 4px;
      }

      @media (max-width: 900px) {
        .garden-sim-card {
          flex-direction: column;
          min-height: 0;
        }
      }

      /* ================== ĐỒNG HỒ GÓC PHẢI DƯỚI ================== */

      .realtime-clock {
        position: fixed;
        bottom: 10px;
        right: 20px;
        z-index: 50;
        padding: 20px 40px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.85);
        color: #e5e7eb;
        font-size: 25px;
        font-weight: 500;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(10px);
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <!-- ========================= SIDEBAR ========================= -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="sidebar-brand-icon">
            <img src="/static/doctorx_logo.png" alt="DoctorX Logo" />
          </div>
          <div>
            <div class="sidebar-brand-text-main">IoT Drinking Tracker</div>
            <div class="sidebar-brand-text-sub">Drink · Grow · Repeat</div>
          </div>
        </div>

        <div class="sidebar-nav">
          <div class="nav-label-heading">MENU</div>

          <button class="nav-item active" data-section="garden">
            <div class="nav-icon">🏡</div>
            <div>
              <div class="nav-text-main">Garden</div>
              <div class="nav-text-sub">Tổng quan cây & nước</div>
            </div>
          </button>

          <button class="nav-item" data-section="achievements">
            <div class="nav-icon">🏆</div>
            <div>
              <div class="nav-text-main">Achievements</div>
              <div class="nav-text-sub">Thành tích uống nước</div>
            </div>
          </button>

          <button class="nav-item" data-section="shop">
            <div class="nav-icon">🛒</div>
            <div>
              <div class="nav-text-main">Shop</div>
              <div class="nav-text-sub">Chậu cây & skin</div>
            </div>
          </button>

          <button class="nav-item" data-section="activities">
            <div class="nav-icon">📋</div>
            <div>
              <div class="nav-text-main">Activities</div>
              <div class="nav-text-sub">Nhật ký uống nước</div>
            </div>
          </button>

          <button class="nav-item" data-section="personal">
            <div class="nav-icon">👤</div>
            <div>
              <div class="nav-text-main">Personal</div>
              <div class="nav-text-sub">Thông tin & cài đặt</div>
            </div>
          </button>
        </div>
      </aside>

      <!-- ========================= MAIN ========================= -->
      <main class="main-area">
        <header class="main-header">
          <div>
            <div class="main-title">Garden</div>
            <div class="main-subtitle">
              Theo dõi lượng nước uống hằng ngày và sức khỏe của cây.
            </div>
          </div>

          <div class="user-box">
            <span class="user-name-pill" id="user-pill">user</span>
            <button id="btn-logout" class="btn-logout">Đăng xuất</button>
          </div>
        </header>

        <!-- ================== CARD MÔ PHỎNG GARDEN ================== -->
        <section class="garden-sim">
          <div class="garden-sim-card" id="sim-bg">
            <div class="garden-sim-left">

              <!-- 3 khung trắng -->
              <div class="sim-summary-boxes">
                <!-- Khung 1 -->
                <div class="sim-summary-box">
                  <div class="sim-summary-title">Đã uống</div>
                  <div class="sim-summary-value">
                    <span id="sim-water-ml">0</span> ml
                  </div>
                </div>

                <!-- Khung 2 -->
                <div class="sim-summary-box">
                  <div class="sim-summary-title">Trạng thái cây</div>
                  <div class="sim-summary-value" id="sim-status-text">
                    Khô héo
                  </div>
                </div>

                <!-- Khung 3 -->
                <div class="sim-summary-box">
                  <div class="sim-summary-title">Số ngày đã thực hiện</div>
                  <div class="sim-summary-value">
                    <span id="sim-days">0</span> ngày
                  </div>
                </div>
              </div>
          </div>
        </section>
      </main>
    </div>

    <!-- Đồng hồ thời gian thực -->
    <div class="realtime-clock" id="realtime-clock"></div>

 <script>
/* ============================================================
   AUTH
============================================================ */
const token = localStorage.getItem("access_token");
const userEmail = localStorage.getItem("user_email");
if (!token) window.location.href = "/app";

document.getElementById("user-pill").textContent =
  userEmail ? userEmail.split("@")[0] : "user";

document.getElementById("btn-logout").onclick = () => {
  localStorage.removeItem("access_token");
  localStorage.removeItem("user_email");
  window.location.href = "/app";
};

/* ============================================================
   CÁC PHẦN TỬ HTML SẼ GÁN DỮ LIỆU
============================================================ */
const boxWaterValue = document.getElementById("sim-water-ml");
const boxStatusValue = document.getElementById("sim-status-text");
const boxDaysValue = document.getElementById("sim-days");
const simBg = document.getElementById("sim-bg");
/* ============================================================
   HÀM CHỌN ẢNH THEO TIME SLOT
============================================================ */
function getPlantImage(state, slot) {
  return {
    dry: `/static/plant_dry_${slot}.png`,
    growing: `/static/plant_growing_${slot}.png`,
    healthy: `/static/plant_healthy_${slot}.png`,
    bloom: `/static/plant_bloom_${slot}.png`,
  }[state];
}

/* ============================================================
   API
============================================================ */
async function fetchToday() {
  const res = await fetch("/me/water/summary-today", {
    headers: { Authorization: "Bearer " + token },
  });
  return await res.json();
}

async function fetchHistory() {
  const res = await fetch("/me/water/history?days=30", {
    headers: { Authorization: "Bearer " + token },
  });
  return await res.json();
}

async function ingestWater(amount) {
  const resDev = await fetch("/devices", {
    headers: { Authorization: "Bearer " + token },
  });
  const devs = await resDev.json();
  if (!devs.length) return;

  const dev = devs[0];

  await fetch("/ingest/telemetry", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      device_id: dev.device_id,
      api_key: dev.api_key,
      metric_type: "water_intake_ml",
      value: amount,
      payload: { volume_ml: amount },
    }),
  });
}

/* ============================================================
   TÍNH STREAK (SỐ NGÀY ĐÃ THỰC HIỆN)
============================================================ */
function computeStreak(days) {
  let streak = 0;
  for (const d of days.slice().reverse()) {
    const target = d.target_ml || d.daily_target_ml || 2000;
    if (target > 0 && d.total_ml / target >= 0.8) {
      streak++;
    } else {
      break;
    }
  }
  return streak;
}
/* ============================================================
   UPDATE UI
============================================================ */
async function updateDashboard() {
  try {
    const today = await fetchToday();
    const history = await fetchHistory();

    // LẤY GIÁ TRỊ THẬT TỪ API
    const total = today.total_ml || 0;              // tổng ml đã uống
    const target =
      today.target_ml || today.daily_target_ml || 2000; // ngưỡng mỗi ngày

    // BOX 1 — tổng ml hôm nay / target
    boxWaterValue.textContent = `${total} / ${target} ml`;

    // BOX 2 — trạng thái cây
    const mapping = {
      dry: "Khô héo",
      growing: "Phát triển",
      healthy: "Sống tốt",
      bloom: "Nở hoa",
    };
    boxStatusValue.textContent = mapping[today.plant_state] || "Khô héo";

    // BOX 3 — streak (số ngày đạt >= 80% target)
    boxDaysValue.textContent = computeStreak(history.days);

    // ĐỔI HÌNH CÂY THEO TRẠNG THÁI + TIME_SLOT
    simBg.style.backgroundImage = `url('${getPlantImage(
      today.plant_state,
      today.time_slot
    )}')`;
  } catch (err) {
    console.error("Dashboard update error:", err);
  }
}
/* ============================================================
   CLICK BOX 1 => water_detail
============================================================ */
document.querySelector(".sim-summary-boxes .sim-summary-box").onclick = () => {
  window.location.href = "/water_detail";
};

/* ============================================================
   ĐỒNG HỒ
============================================================ */
function updateClock() {
  document.getElementById("realtime-clock").textContent =
    new Date().toLocaleTimeString("vi-VN", {
      hour: "2-digit",
      minute: "2-digit",
    });
}
setInterval(updateClock, 1000);
updateClock();

/* ============================================================
   THEME BACKGROUND NGOÀI DASHBOARD
============================================================ */
function applyDashboardTheme() {
  const hour = new Date().getHours();
  let theme = "";

  if (hour >= 5 && hour < 11) theme = "Morning_v1.png";
  else if (hour >= 11 && hour < 14) theme = "Lunch_V1.png";
  else if (hour >= 14 && hour < 18) theme = "Afternoon_V1.png";
  else theme = "Night_V1.png";

  document.body.style.backgroundImage = `url('/static/${theme}')`;
  document.body.style.backgroundSize = "cover";
  document.body.style.backgroundRepeat = "no-repeat";
  document.body.style.backgroundAttachment = "fixed";
}
applyDashboardTheme();

// Cập nhật mỗi 10 phút để auto đổi theme
setInterval(applyDashboardTheme, 10 * 60 * 1000);


/* ============================================================
   BOOT
============================================================ */
updateDashboard();
setInterval(updateDashboard, 15000);

</script>

  </body>
</html>
